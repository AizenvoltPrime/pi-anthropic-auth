allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  protobufjs: true
# pnpm's minimumReleaseAgeExclude is not honored under `pnpm install
# --frozen-lockfile` (the install CI uses) -- open upstream bugs:
# https://github.com/pnpm/pnpm/issues/11203, #11881, #10266, #10361.
# A per-package exclude that works locally therefore still fails CI on a
# fresh runner until real wall-clock time passes.  A short buffer below
# pnpm's 1440-minute (24h) default absorbs that gap for same-day releases
# of packages we author/review ourselves (pi-*), while still requiring
# every dependency to be at least an hour old before pnpm will install it.
minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - '@rumdl/cli-darwin-arm64@0.2.14'
  - '@rumdl/cli-darwin-x64@0.2.14'
  - '@rumdl/cli-linux-arm64-musl@0.2.14'
  - '@rumdl/cli-linux-arm64@0.2.14'
  - '@rumdl/cli-linux-x64-musl@0.2.14'
  - '@rumdl/cli-linux-x64@0.2.14'
  - '@rumdl/cli-win32-x64@0.2.14'
  - rumdl@0.2.14
  - '@earendil-works/pi-agent-core@0.80.10'
  - '@earendil-works/pi-ai@0.80.10'
  - '@earendil-works/pi-coding-agent@0.80.10'
  - '@earendil-works/pi-tui@0.80.10'
  - '@earendil-works/pi-agent-core@0.84.0'
  - '@earendil-works/pi-ai@0.84.0'
  - '@earendil-works/pi-client@0.84.0'
  - '@earendil-works/pi-coding-agent@0.84.0'
  - '@earendil-works/pi-protocol@0.84.0'
  - '@earendil-works/pi-telemetry@0.84.0'
  - '@earendil-works/pi-tui@0.84.0'
  - '@earendil-works/chord@0.86.0'
  - '@earendil-works/pi-agent-core@0.86.0'
  - '@earendil-works/pi-ai@0.86.0'
  - '@earendil-works/pi-coding-agent@0.86.0'
  - '@earendil-works/pi-telemetry@0.86.0'
  - '@earendil-works/pi-tui@0.86.0'
